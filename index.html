<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 1.7 - Etiquetas de contenido y texto</title>
</head>
<body>
    <h1>Etiquetas de contenido y texto by Jaime</h1>
    <section id="contenido">
        <h2>Contenido</h2>
        <p>Este es un párrafo de ejemplo.</p>
        <hr>
        <pre>Texto preformateado.</pre>
        <blockquote>Esto es una cita en bloque (blockquote).</blockquote>
        <div>Contenedor genérico div.</div>
        <dl>
            <dt>Término 1</dt>
            <dd>Definición del término 1.</dd>
        </dl>
        <figure>
            <img src="Img/HTML LOGO.jpg" alt="Logo de HTML">
            <figcaption>Logo de HTML</figcaption>
        </figure>
    </section>
</body>
</html>
